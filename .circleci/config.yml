version: 2.1

# Reusable command definitions.
# See: https://circleci.com/docs/2.0/configuration-reference/#commands
commands:
  install_cli_global:
    steps:
      - run:
          name: install CLI globally
          command: sudo npm install -g file:dist/openfn-cli.tgz

  check_node_version:
    parameters:
      node_version:
        type: string
        default: ''
    steps:
      - run:
          name: Check Node versions match .tool-versions
          command: scripts/check-node-version.sh << parameters.node_version >>

  install_pnpm:
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  install:
    # Specify the execution environment. You can specify an image from Dockerhub or use one of our Convenience Images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/2.0/configuration-reference/#docker-machine-macos-windows-executor
    docker:
      - image: cimg/node:26.12.0
    resource_class: medium
    # Add steps to the job
    # See: https://circleci.com/docs/2.0/configuration-reference/#steps
    steps:
      - checkout
      - check_node_version
      - install_pnpm
      - restore_cache:
          # See the configuration reference documentation for more details on using restore_cache and save_cache steps
          # https://circleci.com/docs/2.0/configuration-reference/?section=reference#save_cache
          keys:
            - deps-v1-{{ .Branch }}-{{checksum "pnpm-lock.yaml"}}-{{checksum ".tool-versions"}}
      - run:
          name: Install
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: deps-v1-{{ .Branch }}-{{checksum "pnpm-lock.yaml"}}-{{checksum ".tool-versions"}}
          paths:
            - node_modules
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  build:
    docker:
      - image: cimg/node:26.12.0
    resource_class: medium
    steps:
      - attach_workspace:
          at: ~/project
      - check_node_version
      - install_pnpm
      - run:
          name: Build packages
          command: pnpm build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  unit_test:
    docker:
      - image: cimg/node:26.12.0
    resource_class: medium
    parallelism: 1
    steps:
      - attach_workspace:
          at: ~/project
      - check_node_version
      - install_pnpm
      - run:
          name: Run Tests
          command: pnpm test

  format:
    docker:
      - image: cimg/node:26.12.0
    resource_class: medium
    steps:
      - attach_workspace:
          at: ~/project
      - check_node_version
      - install_pnpm
      - run:
          name: Check formatting
          command: pnpm test:format

  type_check:
    docker:
      - image: cimg/node:26.12.0
    resource_class: medium
    steps:
      - attach_workspace:
          at: ~/project
      - check_node_version
      - install_pnpm
      - run:
          name: Type check
          command: pnpm test:types

  build_openfnx:
    docker:
      - image: cimg/node:26.12.0
    resource_class: medium
    steps:
      - attach_workspace:
          at: ~/project
      - check_node_version
      - install_pnpm
      - run:
          name: Build local tarballs
          command: pnpm pack:local dist --no-version
      - persist_to_workspace:
          root: ~/project
          paths:
            - dist

  integration_test:
    docker:
      - image: cimg/node:<< parameters.node_version >>
    resource_class: medium
    parallelism: 1
    parameters:
      node_version:
        type: string
    steps:
      - attach_workspace:
          at: ~/project
      - check_node_version:
          node_version: << parameters.node_version >>
      - install_pnpm
      - install_cli_global
      - run:
          name: Check install
          command: openfn test --log info
      - run:
          name: Run integration test suite
          command: pnpm test:integration

  worker_image:
    docker:
      - image: cimg/node:26.12.0
    resource_class: medium
    steps:
      - checkout
      - check_node_version
      - setup_remote_docker
      - run:
          name: Build worker image
          command: docker build -t ws-worker-ci .
      - run:
          name: Check Node in the image matches .tool-versions
          command: docker run --rm ws-worker-ci /app/scripts/check-node-version.sh
      - run:
          name: Install and load motherduck as user node
          command: |
            docker run --rm --user node ws-worker-ci sh -c '
              mkdir -p /tmp/repo && cd /tmp/repo &&
              npm install --no-audit --no-fund --no-package-lock --ignore-scripts @openfn/language-motherduck@latest &&
              node -e "require(\"@openfn/language-motherduck\")"
            '

  # This ensures that we can run a v1 CLI deploy in node 18,
  # which is important for GH sync
  legacy_test:
    docker:
      - image: cimg/node:18.20
    resource_class: medium
    parallelism: 1
    steps:
      - attach_workspace:
          at: ~/project
      - install_cli_global
      - run:
          name: Run legacy test suite
          command: pnpm test:legacy

# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  build_and_test:
    jobs:
      - install:
          filters:
            branches:
              ignore:
                - main
      - build:
          requires:
            - install
      - unit_test:
          requires:
            - build
      - type_check:
          requires:
            - build
      - format:
          requires:
            - build
      - build_openfnx:
          requires:
            - build
      - integration_test:
          matrix:
            parameters:
              node_version: ['24.22.0', '26.12.0']
          requires:
            - build_openfnx
      - legacy_test:
          requires:
            - build_openfnx
      - worker_image:
          filters:
            branches:
              ignore:
                - main
