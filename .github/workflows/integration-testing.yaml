name: Integration Testing
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  contract:
    name: "Integration Testing (${{ matrix.target }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: ["test build against Lightning"]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: OpenFn/kit-lightning-integration@v1
        with:
          worker: ${{ github.workspace }}
          lightning: main
